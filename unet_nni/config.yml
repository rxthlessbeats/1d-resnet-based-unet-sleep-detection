authorName: default
experimentName: model_tuning
trialConcurrency: 2
maxExecDuration: 1h
maxTrialNum: 10
trainingServicePlatform: local
searchSpacePath: ../unet/search_space.json
useAnnotation: false
tuner:
  builtinTunerName: TPE
  classArgs:
    optimize_mode: maximize
trial:
  command: uv run sleep-unet train --nni --prepared data/prepared --out artifacts --events train_events.csv
  codeDir: ..
  gpuNum: 1
